<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaturanga - Ancient Indian Strategy Board Game</title>
    <meta name="description" content="Chaturanga is a modern, serverless revival of the ancient Indian strategy board game.">
    <link rel="icon" href="logo.svg?v=2" type="image/svg+xml">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        .repo-grid { display: flex; flex-direction: column; gap: 15px; }
        .repo-card { background: rgba(28, 25, 23, 0.6); border: 1px solid rgba(217, 119, 6, 0.2); padding: 15px; border-radius: 8px; display: flex; flex-direction: column; }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(217, 119, 6, 0.2); }
        .card-header h3 { margin: 0; font-size: 1.1em; color: var(--amber-400, #fbbf24); font-weight: bold; }
        .repo-card p { color: #d6d3d1; font-size: 11px; line-height: 1.5; margin-bottom: 12px; font-family: sans-serif;}
        .card-buttons { display: flex; gap: 8px; }
        .card-buttons a { flex: 1; text-align: center; padding: 6px; text-decoration: none; font-size: 10px; font-weight: bold; text-transform: uppercase; border-radius: 4px;}
        .live-btn { background: var(--amber-600, #d97706); color: #0a0a0a; }
        .code-btn { background: transparent; color: var(--amber-500, #f59e0b); border: 1px solid rgba(217, 119, 6, 0.5); }
    </style>
</head>
<body class="text-amber-100 min-h-screen flex flex-col items-center p-3 font-serif">

    <!-- MENU BAR -->
    <nav class="w-full max-w-[400px] md:max-w-[600px] heritage-card rounded-lg p-3 mt-4 mb-2 z-50 relative mx-auto">
        <div class="flex justify-between items-center">
            <div class="text-amber-500 font-extrabold tracking-widest text-sm uppercase">चतुरङ्ग</div>
            <button id="mobile-menu-btn" onclick="window.toggleMobileMenu()" class="text-amber-500">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden flex-col items-center gap-5 pt-6 pb-6 w-full bg-[#160d07]/95 absolute left-0 top-full rounded-b-xl z-10 border-b border-amber-600/30">
            <button onclick="window.showPage('home'); window.toggleMobileMenu()" class="nav-btn-home text-[14px] text-amber-200 uppercase tracking-[0.2em]">Home</button>
            <button onclick="window.showPage('game'); window.toggleMobileMenu()" class="nav-btn-game text-[14px] text-stone-400 uppercase tracking-[0.2em]">Play</button>
            <button onclick="window.showPage('projects'); window.toggleMobileMenu()" class="nav-btn-projects text-[14px] text-stone-400 uppercase tracking-[0.2em]">Projects</button>
        </div>
    </nav>

    <!-- ALL PAGES CONTAINER -->
    <div class="w-full max-w-[400px] relative mt-2 mx-auto">
        
        <!-- HOME PAGE -->
        <div id="home-container" class="flex flex-col gap-5 pt-6 mb-8 text-center animate-fade-in">
            <div class="py-4 select-none">
                <h1 class="text-4xl text-amber-500 tracking-widest font-bold">चतुरङ्ग</h1>
                <h2 class="text-2xl text-amber-500 tracking-widest font-extrabold uppercase">(CHATURANGA)</h2>
            </div>
            <div class="heritage-card p-6 rounded-xl space-y-4 text-sm text-stone-300">
                <p>Welcome to the ancient Indian battlefield. Experience the common ancestor of modern chess.</p>
                <button onclick="window.showPage('game')" class="w-full py-3 bg-amber-600 rounded-lg font-bold text-stone-950 uppercase mt-2">Play Game Now</button>
            </div>
        </div>

        <!-- GAME PAGE -->
        <div id="game-container" class="hidden flex-col gap-2 pt-1 mb-6 animate-fade-in">
            <div class="flex gap-2 heritage-card p-1 rounded-lg justify-between">
                <button id="btn2P" onclick="window.switchMode('2-Player')" class="flex-1 py-1.5 text-[11px] font-bold bg-stone-900/60 rounded uppercase">👥 Pass & Play</button>
                <button id="btnAI" onclick="window.switchMode('Vs-AI')" class="flex-1 py-1.5 text-[11px] font-bold bg-amber-600 text-stone-950 rounded uppercase">💻 VS Computer</button>
            </div>
            
            <div class="flex justify-center w-full relative mt-1">
                <!-- Evaluation Bar removed. Board perfectly centered -->
                <div id="three-game-container" class="w-full aspect-square max-h-[380px] relative bg-transparent" style="min-height: 300px;"></div>
            </div>

            <div class="flex flex-col gap-2 mt-1">
                <div class="heritage-card rounded-lg p-2">
                    <div class="flex justify-between items-start">
                        <div class="w-1/2 pr-1 border-r border-stone-700/50">
                            <h4 id="loss-title-1" class="text-[9px] font-bold text-amber-500 uppercase mb-1">💀 Your Losses</h4>
                            <div id="black-graveyard" class="flex flex-wrap gap-0.5 min-h-[20px]"></div>
                        </div>
                        <div class="w-1/2 pl-2">
                            <h4 id="loss-title-2" class="text-[9px] font-bold text-amber-500 uppercase mb-1">🤖 AI Losses</h4>
                            <div id="white-graveyard" class="flex flex-wrap gap-0.5 min-h-[20px]"></div>
                        </div>
                    </div>
                </div>

                <div class="heritage-card rounded-lg p-2 h-20 flex flex-col">
                    <h4 class="text-[9px] font-bold text-amber-500 uppercase mb-1 border-b border-amber-600/30 pb-0.5">📜 Battle Chronicles</h4>
                    <div id="move-history-feed" class="overflow-y-auto flex-1 space-y-1 text-[10px] text-stone-300 pr-1">
                        <div class="text-stone-500 italic text-center mt-1">The battlefield awaits...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PROJECTS PAGE -->
        <div id="projects-container" class="hidden flex-col gap-4 pt-4 mb-8 animate-fade-in font-sans">
            <div class="flex flex-row items-center justify-start gap-5 p-4 rounded-xl border border-amber-600/20 bg-stone-900/60 shadow-lg">
                <img src="https://github.com/Kiran-mondal.png" alt="Kiran Mondal" class="w-[75px] h-[75px] rounded-full border-[3px] border-amber-500">
                <div class="text-left flex flex-col justify-center">
                    <h2 class="text-xl font-bold text-amber-500 uppercase tracking-widest m-0 leading-tight">Kiran Mondal</h2>
                    <p class="text-[9px] text-amber-200 uppercase tracking-widest mt-1 mb-2 leading-relaxed">Full-Stack Developer</p>
                    <a href="https://github.com/Kiran-mondal" target="_blank" class="inline-block px-3 py-1 text-[9px] font-bold bg-transparent border border-amber-600/50 text-amber-500 rounded uppercase">GitHub Profile</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="gameOverModal" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
        <div class="bg-stone-950/95 border border-amber-500/50 p-6 rounded-xl max-w-xs w-full text-center">
            <div id="modalIcon" class="text-4xl mb-2">👑</div>
            <h2 id="modalTitle" class="text-xl font-black text-amber-500 uppercase">Battle Settled</h2>
            <p id="modalDesc" class="text-sm text-amber-200 my-3"></p>
            <button onclick="window.triggerReset(); document.getElementById('gameOverModal').classList.add('hidden')" class="w-full py-2 bg-amber-600 rounded font-bold text-stone-950">Restart Battle</button>
        </div>
    </div>

    <script>
        window.showPage = function(targetPage) {
            const pages = ['home', 'game', 'projects'];
            pages.forEach(page => {
                const container = document.getElementById(`${page}-container`);
                if(container) container.style.display = (page === targetPage) ? 'flex' : 'none';
            });
        };
        window.toggleMobileMenu = function() {
            const menu = document.getElementById('mobile-menu');
            if (menu) { menu.classList.toggle('hidden'); menu.classList.toggle('flex'); }
        };
    </script>
    <script src="script.js?v=11"></script>
</body>
</html>
