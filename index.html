<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaturanga - Ancient Indian Strategy Board Game</title>
    <link rel="icon" href="/logo.svg?v=2" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-amber-100 min-h-screen flex flex-col items-center p-3 font-serif">

    <!-- আলাদা ফোল্ডার থেকে মেনুবার ও পেজগুলো এখানে লোড হবে -->
    <div id="menubar-placeholder" class="w-full flex flex-col items-center z-50"></div>

    <script>
        fetch('components/menubar.html')
            .then(res => res.text())
            .then(html => { 
                document.getElementById('menubar-placeholder').innerHTML = html; 
            });
    </script>

    <!-- MAIN GAME CONTAINER (মূল গেম পেজ যা শুধু Game ট্যাবে ক্লিক করলে আসবে) -->
    <div class="w-full max-w-[400px] relative">
        <div id="game-container" class="hidden flex-col gap-3 pt-2 mb-8 animate-fade-in">
            <div class="flex gap-2 heritage-card p-1.5 rounded-lg justify-between mt-2">
                <button id="btn2P" onclick="switchMode('2-Player')" class="flex-1 py-2 text-[11px] font-bold bg-stone-900/60 rounded mode-button">👥 Pass & Play</button>
                <button id="btnAI" onclick="switchMode('Vs-AI')" class="flex-1 py-2 text-[11px] font-bold bg-amber-600 text-stone-950 rounded mode-button">💻 VS Computer</button>
            </div>

            <div class="flex justify-center w-full">
                <div id="board" class="ashtapada-board grid grid-cols-8 gap-0"></div>
            </div>

            <div class="heritage-card rounded-lg p-3 space-y-2">
                <div>
                    <h4 id="loss-title-1" class="text-[10px] font-bold text-amber-500 uppercase tracking-wider mb-1">💀 YOUR LOSSES</h4>
                    <div id="black-graveyard" class="flex flex-wrap gap-1 min-h-[30px]"></div>
                </div>
                <div>
                    <h4 id="loss-title-2" class="text-[10px] font-bold text-amber-500 uppercase tracking-wider mb-1">🤖 COMPUTER LOSSES</h4>
                    <div id="white-graveyard" class="flex flex-wrap gap-1 min-h-[30px]"></div>
                </div>
            </div>

            <div class="heritage-card rounded-lg p-3 mt-1 h-40 flex flex-col">
                <h4 class="text-[10px] font-bold text-amber-500 uppercase tracking-wider mb-2 border-b border-amber-600/30 pb-1">📜 Battle Chronicles</h4>
                <div id="move-history-feed" class="overflow-y-auto flex-1 space-y-2 text-[11px] font-sans text-stone-300 pr-1">
                    <div class="text-stone-500 italic text-center mt-6">The battlefield awaits the first strike...</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="gameOverModal" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-stone-950/95 border border-amber-500/50 p-6 rounded-xl max-w-xs w-full text-center modal-content">
            <div id="modalIcon" class="text-4xl mb-2 modal-icon">👑</div>
            <h2 id="modalTitle" class="text-xl font-black text-amber-500 uppercase">Battle Settled</h2>
            <p id="modalDesc" class="text-sm text-amber-200 my-3"></p>
            <button onclick="triggerReset(); document.getElementById('gameOverModal').classList.add('hidden')" class="w-full py-2 bg-amber-600 rounded font-bold text-stone-950 hover:bg-amber-500">Restart Battle</button>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
